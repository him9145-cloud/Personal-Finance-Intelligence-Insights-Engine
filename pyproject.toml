[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-insights"
version = "0.1.0"
description = "Clean, summarize, and visualize bank transaction CSVs"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
finance-insights = "finance_insights.cli:main"

[tool.setuptools.packages.find]
include = ["finance_insights*"]
